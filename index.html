<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>통합 입사지원 포탈 사이트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 아리오 통합 입사지원 — Apps Script 프로젝트에 HTML 파일 '지원'으로 붙여 넣으면 웹앱주소?page=apply 로 열림
   11/20 디자인: 시안 A "채용 포털" (아리 관리 화면과 같은 회색 + 초록, 선 · 목록 중심) */
:root{--ink:#17181B;--ink2:#43464E;--sub:#62666E;--line:#E3E4E8;--bg:#F7F7F8;--acc:#1D7A5F;--acc-bg:#E5F3EE;--red:#C9372C;--red-bg:#FCEDEB;
  --pri:#17181B;--pri-bg:#EEEFF2}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:#fff;color:var(--ink);font:16px/1.55 Pretendard,'Malgun Gothic',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:11px 16px;font-weight:700;background:#fff;color:var(--ink)}
button:hover{background:var(--bg)}
button.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
button.pri:hover{background:#000}
button.big{width:100%;padding:14px;font-size:16px}
button:disabled{opacity:.45}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 12px;outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--ink)}
textarea{min-height:100px;resize:vertical}
input::placeholder,textarea::placeholder{font-size:14.5px;color:#9A9DA4}
/* 틀: 위쪽 머리줄 + 가운데 내용 */
.top{display:flex;align-items:center;gap:10px;height:60px;padding:0 32px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:10}
.top img{width:28px;height:28px}   /* 11/20 로고 시안 B */
.top b{font-size:16px;font-weight:800}
.top span{margin-left:auto;color:var(--sub);font-size:14px}
.steps{display:flex;height:3px;background:var(--line)}.steps i{flex:1}.steps i.on{background:var(--acc)}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px calc(110px + env(safe-area-inset-bottom))}
body[data-step="step1"] .wrap,body[data-step="step3"] .wrap{max-width:1200px;padding:0 0 calc(110px + env(safe-area-inset-bottom))}
h1{font-size:24px;line-height:1.35;margin:0 0 6px;font-weight:800}
.lead{color:var(--sub);margin:0 0 20px;font-size:15px}
.empty{border:1px solid var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--sub);font-size:15px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--acc-bg);color:var(--acc);margin-left:6px;vertical-align:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}

/* 1. 첫 화면: 왼쪽 조건 · 오른쪽 목록 */
.home{display:grid;grid-template-columns:320px 1fr;min-height:calc(100vh - 60px)}
.filt{border-right:1px solid var(--line);background:var(--bg);padding:28px 24px}
.filt h1{font-size:22px}
.filt .lead{font-size:14px;margin-bottom:18px}
.seg2{display:flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:#fff;margin-bottom:12px}
.seg2 button{flex:1;border:0;padding:8px;border-radius:6px;color:var(--sub);font-weight:600}.seg2 button.on{background:var(--ink);color:#fff}
.filt input,.filt select{margin-bottom:10px}
.only{display:flex;align-items:center;gap:8px;font-size:14.5px;margin:4px 0 0;cursor:pointer}.only input{width:18px;height:18px;margin:0;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chips button{padding:6px 12px;font-size:14px;font-weight:600;border-radius:999px}.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.site-foot{margin-top:24px;padding-top:14px;border-top:1px solid var(--line);color:var(--sub);font-size:12.5px;line-height:1.7}
.res{padding:28px 32px}
.res .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}.res .hd b{font-size:16px}.res .hd span{color:var(--sub);font-size:14px}
.rows{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rowi{width:100%;display:grid;grid-template-columns:44px minmax(0,1fr) 150px 20px;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;background:#fff;padding:12px 16px;text-align:left;font-weight:700}
.rowi:last-child{border-bottom:0}.rowi:hover{background:#FAFAFB}
.rowi small{display:block;color:var(--sub);font-weight:500;font-size:13.5px}
.rowi .cell{color:var(--ink2);font-weight:500;font-size:14px}
.rowi .chev{color:#B9BCC2;font-size:20px}
.draft{display:flex;align-items:center;gap:10px;border:1px solid var(--acc);background:var(--acc-bg);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14.5px}
.draft b{flex:1}.draft button{padding:7px 12px;font-size:14px}

/* 브랜드 소개 · 매장 고르기 */
.intro{display:flex;gap:16px;align-items:center;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:20px}
.intro .logo{position:relative;width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:26px;font-weight:800;color:#fff;flex-shrink:0}
.intro .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.intro h1{margin:0}
.intro .one{color:var(--ink2);margin:2px 0 0}
.facts{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;margin-bottom:20px;overflow:hidden}
.facts div{padding:12px 16px;border-right:1px solid var(--line)}.facts div:last-child{border-right:0}
.facts small{display:block;color:var(--sub);font-size:13px}.facts b{font-size:16px}
.info{padding:16px 0;border-bottom:1px solid var(--line)}
.info h3{margin:0 0 6px;font-size:16px}
.info p{margin:0;white-space:pre-line;color:var(--ink2)}.info .none{color:var(--sub)}
.store{width:100%;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:8px;text-align:left;font-weight:700;background:#fff}
.store.on{border-color:var(--acc);background:var(--acc-bg)}
.store small{display:block;color:var(--sub);font-weight:500;font-size:13.5px}
.store .dot{width:20px;height:20px;border-radius:50%;border:2px solid #C4C7CD;flex-shrink:0}.store.on .dot{border:6px solid var(--acc)}

/* 3. 지원서: 왼쪽 목차 · 오른쪽 문항 */
.form{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 63px)}
.toc{border-right:1px solid var(--line);background:var(--bg);padding:24px}
.toc .who{font-size:13px;color:var(--sub);margin-bottom:16px}.toc .who b{display:block;color:var(--ink);font-size:16px}
.toc a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-size:14.5px;cursor:pointer}
.toc a:hover{background:#EFEFF1}
.toc a i{width:22px;height:22px;border-radius:50%;border:1.5px solid #C4C7CD;font:700 11px/19px sans-serif;text-align:center;font-style:normal;color:var(--sub);flex-shrink:0}
.toc a.done i{background:var(--acc);border-color:var(--acc);color:#fff}
.toc .left{margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13.5px;color:var(--sub)}.toc .left b{color:var(--red)}
.toc-sticky{position:sticky;top:84px}
.fbody{padding:28px 40px;max-width:760px}
.mstep{display:none}
label{display:block;font-size:14.5px;font-weight:600;color:var(--ink);margin:18px 0 6px}
label span{color:var(--red)}
.bad input,.bad textarea,.bad select,input.bad,textarea.bad{border-color:var(--red)!important;background:#FFFBFA}
.bad .pick button,.pick.bad button{border-color:var(--red)}
.qsec{font-size:18px;margin:36px 0 2px;padding-top:24px;border-top:1px solid var(--line);scroll-margin-top:80px}
.qsec:first-of-type{margin-top:8px;padding-top:0;border-top:0}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{padding:9px 14px;border-radius:8px;font-size:14.5px;font-weight:600}
.pick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.trow{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}.trow b{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:8px}.trow input,.trow select{margin-bottom:8px}.trow .row2{margin-bottom:0}
.per{display:flex;align-items:center;gap:6px;margin-bottom:8px}.per span{font-size:14px;color:var(--sub);flex-shrink:0}.per input{margin:0;flex:1;min-width:0}.per em{font-style:normal;color:var(--sub)}
.del{border:0;background:none;color:var(--red);font-size:13px;padding:2px 6px}
.addrow{width:100%;padding:11px;border:1px dashed #B9BCC2;color:var(--ink2);font-weight:600}
.chk{display:flex;gap:10px;align-items:center;font-size:15.5px;font-weight:600;margin:10px 0 0;color:var(--ink);cursor:pointer}
.chk input{width:20px;height:20px;margin:0;accent-color:var(--acc);flex-shrink:0}
.agree{border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-top:22px;font-size:14px;color:var(--ink2);scroll-margin-top:80px}
.agree table{width:100%;border-collapse:collapse;margin:8px 0}
.agree td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.agree td:first-child{color:var(--sub);width:86px}
.opt{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:10px;font-size:14px;color:var(--ink2)}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:20px;margin-top:12px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:12px;padding:22px 20px 18px;max-width:360px;width:100%}
.modal b{display:block;font-size:17px;margin-bottom:6px}.modal p{margin:0 0 18px;color:var(--ink2);font-size:15px}
.modal div{display:flex;flex-direction:row-reverse;gap:8px}.modal button{flex:1}
/* 아래 고정 버튼줄 */
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom));z-index:10}
.foot div{max-width:1200px;margin:0 auto;display:flex;gap:10px;align-items:center}
.foot .left{flex:1;color:var(--sub);font-size:14px}.foot .left b{color:var(--red)}
.foot .back{flex:0 0 auto}
.foot #next{width:auto;min-width:220px}
/* 4. 완료 */
.done{text-align:center;padding-top:40px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--acc-bg);color:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:32px;font-weight:800}
.no{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:10px 18px;font-size:20px;font-weight:800;margin:18px 0 6px;letter-spacing:1px}

/* 휴대폰 */
@media (max-width:760px){
  .top{height:54px;padding:0 16px}.top span{display:none}
  .wrap{padding:20px 16px calc(130px + env(safe-area-inset-bottom))}
  .home,.form{display:block;min-height:0}
  .filt{border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}
  .filt h1{font-size:21px}
  .res{padding:14px 16px}
  .rowi{grid-template-columns:40px minmax(0,1fr) 16px;padding:12px}.rowi .cell{display:none}.av{width:40px;height:40px}
  .toc{display:none}
  .mstep{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--bg);font-size:14px;position:sticky;top:54px;z-index:5}
  .mstep b{color:var(--red)}
  .fbody{padding:8px 16px 20px}
  .qsec{scroll-margin-top:110px}
  .foot div{flex-wrap:wrap}.foot .left{width:100%;flex:none}.foot #next{flex:1;min-width:0}
  .facts div{padding:10px 12px}
}
</style>
</head>
<body>
<header class="top"><img id="logo" alt=""><b>통합 입사지원</b><span id="topr">매장에서 함께 일할 동료를 찾아요</span></header>
<div class="steps" id="steps" hidden><i></i><i></i><i></i></div>
<div class="wrap"><main id="view"><div class="empty">불러오는 중…</div></main></div>
<div class="foot" id="foot" hidden><div><span class="left" id="fleft"></span><button class="back" id="back">이전</button><button class="pri big" id="next">다음</button></div></div>

let curStep = '', popping = false;
function mark(name) {
  const st = { s:name, 방식:S1.방식 };

const F0 = JSON.stringify(F);
function clearForm() {
  const 남김 = { 단계:F.단계, 브랜드:F.브랜드, 매장코드:F.매장코드, 시도:F.시도, 구군:F.구군, 바로:F.바로 };

/** 지원서에 뭐라도 썼는지 (사진 · 학력 · 경력 포함) */
function hasInput() {

const FIXED = ['이름', '생년월일', '연락처'];
function Q(b) {
  const c = (brand() || {}).지원서 || {}, 끔 = c.끔 || [], 필수 = c.필수 || {}, key = q => q.k || q.mod;
  let l = QALL(b).filter(q => q.sec || FIXED.indexOf(key(q)) >= 0 || 끔.indexOf(key(q)) < 0)
    .map(q => !q.sec && FIXED.indexOf(key(q)) < 0 && 필수[key(q)] != null ? Object.assign({}, q, { req:필수[key(q)] }) : q);
  const 추가 = (c.추가 || []).map(x => ({ k:'추가_' + x.id, id:x.id, t:x.t, req:x.필수, area: x.형식 === '긴글' ? 1 : 0, max:1000, pick: x.형식 === '선택' ? x.보기 : null }));

  let n = 0;

}

    <div class="no">${esc(no)}</div><div class="lead">접수번호 · 문의할 때 알려 주세요</div>
    <button class="big" style="margin-top:30px" onclick="location.reload()">처음으로</button></div>`;
}

$('#logo').src = LOGO;
call({ action:'지원안내' }).then(r => {
  BRANDS = (r && r.브랜드) || []; if (r && r.항목) ITEMS = r.항목;
  if (!BRANDS.length) return $('#view').innerHTML = '<div class="empty">지금은 지원을 받는 브랜드가 없어요.</div>';
  loadDraft(); step1();
}).catch(() => { $('#view').innerHTML = '<div class="empty">잠시 후 다시 열어 주세요.</div>'; });
</script>
