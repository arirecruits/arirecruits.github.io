<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>통합 입사지원 포탈 사이트 (미리보기)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 아리오 통합 입사지원 — Apps Script 프로젝트에 HTML 파일 '지원'으로 붙여 넣으면 웹앱주소?page=apply 로 열림 */
:root{--pri:#3182F6;--pri-d:#1B64DA;--pri-bg:#E8F3FF;--ink:#191F28;--ink2:#333D4B;--sub:#8B95A1;--line:#E5E8EB;--bg:#F2F4F6;--red:#F04452;--green:#03A94D;--green-bg:#E5F8EE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Pretendard,'Malgun Gothic',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;border-radius:16px;padding:15px 18px;font-weight:700;background:#fff;color:var(--ink2);transition:transform .08s}
button:active{transform:scale(.98)}
button.pri{background:var(--pri);color:#fff}
button.big{width:100%;padding:18px;font-size:17px}
button:disabled{opacity:.45}
input,select,textarea{width:100%;border:0;background:#fff;border-radius:14px;padding:16px;outline:none}
input:focus,select:focus,textarea:focus{box-shadow:inset 0 0 0 2px var(--pri)}
textarea{min-height:110px;resize:vertical}
.wrap{max-width:560px;margin:0 auto;padding:20px 20px calc(120px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:4px 0 22px}
.top img{width:34px;height:34px;border-radius:11px;background:#fff}
.top b{font-size:17px;font-weight:800}
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps i{flex:1;height:5px;border-radius:9px;background:#D9DEE3}
.steps i.on{background:var(--pri)}
h1{font-size:26px;line-height:1.35;margin:0 0 8px;font-weight:800}
.lead{color:var(--sub);margin:0 0 22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.brand{background:#fff;border-radius:20px;padding:20px 16px;text-align:left;display:flex;flex-direction:column;gap:12px;border:2px solid transparent}
.brand.on{border-color:var(--pri);background:var(--pri-bg)}
.brand .av{width:44px;height:44px;border-radius:15px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.brand small{color:var(--sub);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.store{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:15px 16px;margin-bottom:8px;text-align:left;border:2px solid transparent;font-weight:600}
.store.on{border-color:var(--pri);background:var(--pri-bg)}
.store small{display:block;color:var(--sub);font-weight:500;font-size:13.5px}
.store .dot{width:22px;height:22px;border-radius:50%;border:2px solid #C4CAD0;flex-shrink:0}
.store.on .dot{border:7px solid var(--pri)}
label{display:block;font-size:14px;font-weight:700;color:var(--ink2);margin:16px 0 8px}
label span{color:var(--red)}
.agree{background:#fff;border-radius:18px;padding:18px;margin-top:18px;font-size:14px;color:var(--ink2)}
.agree table{width:100%;border-collapse:collapse;margin:10px 0}
.agree td{padding:7px 0;border-bottom:1px solid var(--bg);vertical-align:top}
.agree td:first-child{color:var(--sub);width:86px;font-weight:600}
.agree .chk{display:flex;gap:10px;align-items:center;font-size:16px;font-weight:700;margin-top:6px;color:var(--ink)}
.agree .chk input{width:24px;height:24px;accent-color:var(--pri);flex-shrink:0}
.foot{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.foot div{max-width:560px;margin:0 auto;display:flex;gap:10px}
.foot .back{flex:0 0 auto;padding:18px 20px}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:20px;margin-top:10px;text-align:center}
.done{text-align:center;padding-top:40px}
.done .ok{width:76px;height:76px;border-radius:26px;background:var(--green-bg);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:40px;font-weight:800}
.no{display:inline-block;background:#fff;border-radius:14px;padding:12px 20px;font-size:20px;font-weight:800;margin:18px 0 8px;letter-spacing:1px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.empty{background:#fff;border-radius:16px;padding:22px;text-align:center;color:var(--sub)}
/* 첫 화면 꾸미기 */
body{background:radial-gradient(1100px 520px at 100% -8%,#CFE2FF 0%,rgba(207,226,255,0) 62%),radial-gradient(800px 420px at -12% 18%,#E6DEFF 0%,rgba(230,222,255,0) 58%),var(--bg);background-attachment:fixed}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px 24px 26px;color:#fff;background:linear-gradient(135deg,#2B6CF0 0%,#4F8BFF 55%,#7C5CFA 100%);box-shadow:0 18px 40px rgba(49,130,246,.28);margin-bottom:18px}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:220px;height:220px;right:-70px;top:-80px}
.hero::after{width:140px;height:140px;right:40px;bottom:-70px;background:rgba(255,255,255,.10)}
.hero .tag{display:inline-block;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:14px}
.hero h1{font-size:28px;color:#fff;margin:0 0 10px;position:relative}
.hero p{margin:0;opacity:.9;position:relative}
.hero svg{position:absolute;right:16px;top:16px;width:70px;height:70px;opacity:.95}
.stats{display:flex;gap:8px;margin-top:22px;position:relative}
.stats div{flex:1;background:rgba(255,255,255,.16);border-radius:16px;padding:12px}
.stats b{display:block;font-size:22px}
.stats small{opacity:.85;font-size:12.5px;font-weight:600}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:26px}
.how div{background:rgba(255,255,255,.85);backdrop-filter:blur(6px);border-radius:18px;padding:14px 12px;font-size:13.5px;font-weight:700;color:var(--ink2)}
.how i{display:flex;width:28px;height:28px;border-radius:10px;background:var(--pri-bg);color:var(--pri);font-style:normal;align-items:center;justify-content:center;margin-bottom:8px;font-weight:800}
.how small{display:block;color:var(--sub);font-weight:500;margin-top:2px;font-size:12.5px}
.sect{font-size:19px;font-weight:800;margin:0 0 12px}
.brand{box-shadow:0 4px 16px rgba(25,31,40,.05)}
.brand .regions{color:var(--sub);font-size:12.5px;font-weight:500;margin-top:2px}
.search{position:relative;margin:4px 0 14px}
.search input{padding-left:46px;box-shadow:0 4px 16px rgba(25,31,40,.05)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--sub)}
.tabs{display:flex;background:#E4E8EC;border-radius:16px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;background:none;padding:12px;border-radius:13px;color:var(--sub)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.hot{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 22px;padding:2px 20px;scrollbar-width:none}
.hot::-webkit-scrollbar{display:none}
.hot button{flex-shrink:0;display:flex;align-items:center;gap:8px;padding:10px 14px 10px 10px;border-radius:999px;font-size:14.5px;box-shadow:0 4px 14px rgba(25,31,40,.06)}
.hot .av{width:28px;height:28px;border-radius:50%;font-size:13px;color:#fff;display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 12px;padding:0 20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex-shrink:0;padding:9px 15px;border-radius:999px;font-size:14px}
.chips button.on{background:var(--ink);color:#fff}
.rows{background:#fff;border-radius:22px;padding:6px;box-shadow:0 4px 16px rgba(25,31,40,.05)}
.rowi{width:100%;display:flex;align-items:center;gap:12px;background:none;padding:13px 12px;border-radius:16px;text-align:left;font-weight:700}
.rowi:hover{background:#F7F9FB}
.rowi .av{width:42px;height:42px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rowi small{display:block;color:var(--sub);font-weight:500;font-size:13.5px;margin-top:1px}
.rowi .chev{margin-left:auto;color:#C4CAD0;font-size:20px}
.badge{display:inline-block;font-size:11.5px;font-weight:800;color:var(--red);background:#FFEEEF;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.cnt{color:var(--sub);font-size:13.5px;margin:0 4px 8px}
/* 마우스로 쓰는 PC: 옆으로 밀 수 없으니 여러 줄로 펼침 */
@media (hover:hover) and (pointer:fine){.hot,.chips{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}}
.intro{background:#fff;border-radius:26px;padding:24px;box-shadow:0 8px 28px rgba(25,31,40,.07);margin-bottom:14px;position:relative;overflow:hidden}
.intro::before{content:'';position:absolute;inset:0 0 auto 0;height:86px;background:var(--brand-bg,#E8F3FF)}
.intro .logo{position:relative;width:72px;height:72px;border-radius:22px;background:#fff;box-shadow:0 6px 18px rgba(25,31,40,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;margin:18px 0 14px;font-size:28px;font-weight:800;color:#fff}
.intro .logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.intro h1{position:relative;margin:0 0 6px}
.intro .one{color:var(--ink2);font-weight:600;margin:0}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.pills span{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--bg);color:var(--ink2)}
.pills .hotp{background:#FFEEEF;color:var(--red)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.facts div{background:#fff;border-radius:18px;padding:14px 12px}
.facts small{display:block;color:var(--sub);font-size:12.5px;font-weight:600}
.facts b{display:block;font-size:16px;margin-top:2px;word-break:keep-all}
.info{background:#fff;border-radius:22px;padding:20px;margin-bottom:10px}
.info h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:8px}
.info h3 i{font-style:normal;width:28px;height:28px;border-radius:10px;background:var(--pri-bg);display:flex;align-items:center;justify-content:center;font-size:14px}
.info p{margin:0;white-space:pre-line;color:var(--ink2)}
.info .none{color:var(--sub)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.trow{background:#F9FAFB;border-radius:12px;padding:12px;margin-bottom:10px}.trow b{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}.trow input,.trow select{margin-bottom:8px}.trow .row2{margin-bottom:0}
.del{border:0;background:none;color:#F04452;font-size:13px}.addrow{width:100%;padding:12px;border:1px dashed #B0B8C1;border-radius:12px;background:#fff;color:#3182F6;font-weight:600}
.qsec{font-size:17px;margin:30px 0 -4px;padding-top:18px;border-top:1px solid #E5E8EB}
.pick button{padding:10px 14px;border-radius:999px;font-size:14.5px;font-weight:600;border:2px solid transparent}
.pick button.on{background:var(--pri-bg);color:var(--pri);border-color:var(--pri)}
.opt{background:#fff;border-radius:18px;padding:16px 18px;margin-top:12px;font-size:14px;color:var(--ink2)}
.opt .chk{display:flex;gap:10px;align-items:center;font-size:15.5px;font-weight:700;color:var(--ink);margin-top:8px}
.opt .chk input{width:22px;height:22px;accent-color:var(--pri);flex-shrink:0}
.site-foot{margin-top:34px;padding-top:18px;border-top:1px solid #DDE2E7;color:var(--sub);font-size:12.5px;line-height:1.7}</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img id="logo" alt=""><b>통합 입사지원 포탈 사이트</b></div>
  <div class="steps" id="steps"><i></i><i></i><i></i></div>
  <main id="view"><div class="empty">불러오는 중…</div></main>
</div>
<div class="foot" id="foot" hidden><div><button class="back" id="back">이전</button><button class="pri big" id="next">다음</button></div></div>

  one('군별', () => F.병역.군별, v => F.병역.군별 = v);
  ['언어', '특기'].forEach(k => { const box = $('#p' + k); if (box) box.querySelectorAll('button').forEach(x => x.onclick = () => {
    const v = x.dataset.v, i = F[k].indexOf(v); i >= 0 ? F[k].splice(i, 1) : F[k].push(v); x.classList.toggle('on', i < 0); }); });
  $('#사진').onchange = e => { const f = e.target.files[0]; if (!f) return;
    const img = new Image(); img.onload = () => {   // 서버에 보내기 전에 줄임 (가로세로 600px 이하 JPG)
      const k = Math.min(1, 600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      F.사진 = { name:'사진.jpg', type:'image/jpeg', data:c.toDataURL('image/jpeg', 0.85) }; URL.revokeObjectURL(img.src); $('#사진안내').textContent = '사진이 첨부됐어요'; };
    img.onerror = () => { F.사진 = null; $('#사진안내').textContent = '사진 파일을 열 수 없어요. JPG · PNG로 골라 주세요'; };
    img.src = URL.createObjectURL(f); };
  $('#연락처').oninput = e => { const d = e.target.value.replace(/\D/g, '').slice(0, 11); e.target.value = d.replace(/^(\d{3})(\d{1,4})?(\d{1,4})?$/, (_, a, b2, c) => [a, b2, c].filter(Boolean).join('-')); };
  foot(submit, '지원하기', () => { keep(); F.바로 ? step1() : step2(); });
}
/* 경력: 한 줄에 회사 하나 (최대 5개) */
function carHtml() {
  return `<label class="chk" style="margin-top:0"><input type="checkbox" id="무경력" ${F.무경력 ? 'checked' : ''} onchange="keepCar();F.무경력=this.checked;$('#w경력').innerHTML=carHtml()">경력이 없어요</label>`
    + (F.무경력 ? '' : F.경력표.map((c, i) => `<div class="trow"><b>경력 ${i + 1}${F.경력표.length > 1 ? ` <button type="button" class="del" onclick="carDel(${i})">지우기</button>` : ''}</b>
      <input id="경_회사${i}" maxlength="100" placeholder="회사명 · 브랜드 (예: OO 판교점)" value="${esc(c.회사 || '')}">
      <div class="row2"><input id="경_기간${i}" maxlength="40" placeholder="근무 기간 (예: 2023.03 ~ 2024.08)" value="${esc(c.기간 || '')}">
      <input id="경_직위${i}" maxlength="40" placeholder="직위 (예: 스태프)" value="${esc(c.직위 || '')}"></div>
      <input id="경_업무${i}" maxlength="100" placeholder="담당 업무 (예: 판매 · 고객응대 · 재고)" value="${esc(c.업무 || '')}">
      <input id="경_퇴사사유${i}" maxlength="100" placeholder="퇴사 사유 (예: 계약 만료 · 학업 · 재직 중)" value="${esc(c.퇴사사유 || '')}"></div>`).join('')
      + (F.경력표.length < 5 ? `<button type="button" class="addrow" onclick="carAdd()">+ 경력 추가 (최대 5개)</button>` : ''));
}
function keepCar() { if (!$('#경_회사0')) return; F.경력표.forEach((c, i) => ['회사', '기간', '직위', '업무', '퇴사사유'].forEach(k => c[k] = $('#경_' + k + i).value)); }
function carAdd() { keepCar(); F.경력표.push({}); $('#w경력').innerHTML = carHtml(); }
function carDel(i) { keepCar(); F.경력표.splice(i, 1); $('#w경력').innerHTML = carHtml(); }
function keep() {
  F.학력표.forEach((e, i) => ['학교명', '기간', '수학'].concat(i ? ['전공'] : []).forEach(k => e[k] = $('#학_' + k + i).value));
  keepCar(); F.무경력 = $('#무경력').checked;
  Q('').filter(q => q.k && !q.pick).forEach(q => F[q.k] = $('#' + q.k).value);
  ['병과', '계급', '기간', '면제사유'].forEach(k => F.병역[k] = $('#병역_' + k).value);
  F.동의 = $('#동의').checked; F.동의3 = $('#동의3').checked; F.인재풀 = $('#인재풀').checked;
}
async function submit() {
  keep();
  const err = m => { $('#err').textContent = m; };
  const miss = Q(brand().이름).find(q => q.req && !String(F[q.k] || '').trim());
  if (miss) return err(miss.t.replace(/\s*\(.*$/, '') + ' 항목을 입력해 주세요.');
  if (!F.학력표.some(e => e.학교명.trim())) return err('학력 사항을 입력해 주세요.');
  if (!F.무경력 && !F.경력표.some(c => String(c.회사 || '').trim())) return err('경력 사항을 입력하거나 "경력이 없어요"를 골라 주세요.');
  if (!/^01\d{8,9}$/.test(F.연락처.replace(/\D/g, ''))) return err('휴대폰 번호를 확인해 주세요.');
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(F.이메일.trim())) return err('이메일을 확인해 주세요.');
  if (F.포트폴리오.trim() && !/^https?:\/\/\S+$/.test(F.포트폴리오.trim())) return err('포트폴리오 링크는 https:// 로 시작하게 적어 주세요.');
  if (!F.동의) return err('개인정보 수집 · 이용에 동의해 주세요.');
  if (!F.동의3) return err('개인정보 제3자 제공에 동의해 주세요.');
  $('#next').disabled = true; $('#next').textContent = '보내는 중…';
  const b = brand(), m = b.매장.find(x => String(x.매장코드) === F.매장코드);
  const 답 = {}; Q('').filter(q => q.k).forEach(q => 답[q.k] = String(F[q.k] || '').trim());
  const r = await call(Object.assign(답, { action:'지원접수', 브랜드:F.브랜드, 매장코드:F.매장코드, 시도: m ? m.시도 : F.시도, 구군: m ? m.구군 : F.구군,
    개인정보동의:'Y', 제3자동의:'Y', 가능언어:F.언어, 특기:F.특기, 인재풀동의: F.인재풀 ? 'Y' : '',
    병역: F.성별 === '남성' ? F.병역 : {}, 사진:F.사진,
    학력표:F.학력표, 경력표: F.무경력 ? [] : F.경력표, 무경력: F.무경력 ? 'Y' : '', 웹사이트:$('#웹사이트').value }))
    .catch(() => ({ error:'인터넷 연결을 확인하고 다시 시도해 주세요.' }));
  if (!r.success) { $('#next').disabled = false; $('#next').textContent = '지원하기'; return err(r.error || '접수하지 못했어요. 다시 시도해 주세요.'); }
  done(r.접수번호, m);
}

/* 4. 완료 */
function done(no, m) {
  $('#steps').hidden = true; foot(null); window.scrollTo(0, 0);
  $('#view').innerHTML = `<div class="done"><div class="ok">✓</div><h1>지원이 접수되었어요</h1>
    <p class="lead" style="margin:0">${m && m.매장.indexOf(F.브랜드) === 0 ? esc(m.매장) : esc(F.브랜드) + (m ? ' ' + esc(m.매장) : '')} 담당자가 확인한 뒤<br>입력하신 번호로 연락드릴게요</p>
    <div class="no">${esc(no)}</div><div class="lead">접수번호 · 문의할 때 알려 주세요</div>
    <button class="big" style="margin-top:30px" onclick="location.reload()">처음으로</button></div>`;
}

$('#logo').src = LOGO;
call({ action:'지원안내' }).then(r => {
  BRANDS = (r && r.브랜드) || []; if (r && r.항목) ITEMS = r.항목;
  if (!BRANDS.length) return $('#view').innerHTML = '<div class="empty">지금은 지원을 받는 브랜드가 없어요.</div>';
  step1();
}).catch(() => { $('#view').innerHTML = '<div class="empty">잠시 후 다시 열어 주세요.</div>'; });
</script>
</body>
